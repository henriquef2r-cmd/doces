<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Encomendas</title>
<meta name="theme-color" content="#6B4226">
<link rel="icon" href="icone.svg">
<style>
  :root{--azul:#6B4226;--azul-claro:#F3E9E1;--rosa:#C98B6B;--rosa-claro:#FBEDEA;--verde:#2e7d32;--vermelho:#b3261e;--bg:#F8F4F0;--borda:#E2D6CC;--texto:#3B2A20;}
  .desconto{background:#FFF3E0;color:#7A4A12;border-radius:12px;padding:10px 12px;font-size:13.5px;margin-bottom:10px;line-height:1.4;}
  .desconto.ganhou{background:#E8F5E9;color:#1B5E20;}
  .promo{position:fixed;left:0;right:0;bottom:calc(132px + env(safe-area-inset-bottom));z-index:6;padding:0 10px;pointer-events:none;}
  .promo-in{max-width:620px;margin:0 auto;background:#FFF3E0;color:#6B3E0C;border:1.5px solid #F3C98B;border-radius:14px;padding:9px 12px;box-shadow:0 6px 18px rgba(60,35,10,.18);font-size:13.5px;line-height:1.35;pointer-events:auto;}
  .promo-in.ganhou{background:#E8F5E9;color:#1B5E20;border-color:#A5D6A7;}
  .promo-top{display:flex;align-items:center;gap:10px;}
  .promo-txt{flex:1;min-width:0;}
  .promo-txt small{display:block;font-size:12px;opacity:.85;margin-top:1px;}
  .promo-btn{flex-shrink:0;border:none;border-radius:10px;padding:8px 11px;font-size:13px;font-weight:700;background:#E07B00;color:#fff;}
  .promo-in.ganhou .promo-btn{background:#2e7d32;}
  .promo-bar{height:6px;border-radius:3px;background:rgba(224,123,0,.18);margin-top:7px;overflow:hidden;}
  .promo-bar i{display:block;height:100%;background:#E07B00;border-radius:3px;transition:width .35s ease;}
  .promo-in.ganhou .promo-bar i{background:#2e7d32;}
  .promo-x{border:none;background:none;color:inherit;opacity:.55;font-size:18px;line-height:1;padding:0 2px;flex-shrink:0;}
  .promo-mini{max-width:620px;margin:0 auto;display:flex;justify-content:flex-end;pointer-events:none;}
  .promo-mini button{pointer-events:auto;border:1.5px solid #F3C98B;background:#FFF3E0;color:#6B3E0C;border-radius:20px;padding:6px 12px;font-size:12.5px;font-weight:700;box-shadow:0 4px 12px rgba(60,35,10,.15);}
  @keyframes pulo{0%{transform:scale(1)}40%{transform:scale(1.04)}100%{transform:scale(1)}}
  .promo-in.pulou{animation:pulo .5s ease;}
  .modos-bolo{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0 4px;}
  .modo-bolo{border:1.5px solid var(--borda);background:#fff;border-radius:14px;padding:13px 10px;text-align:center;font-weight:700;color:var(--texto);font-size:14.5px;}
  .modo-bolo small{display:block;font-weight:500;color:#8a817a;font-size:11.5px;margin-top:3px;line-height:1.3;}
  .modo-bolo.on{border-color:var(--azul);background:var(--azul-claro);color:var(--azul);}
  .sugestao{border:1.5px dashed var(--rosa);background:var(--rosa-claro);}
  .sugestao .chips{margin-top:10px;}
  .dica-item{font-size:12px;color:#B35F00;font-weight:700;margin-top:3px;}
  .dica-item.ok{color:#1B5E20;}
  .dica-item a{color:inherit;}
  *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-tap-highlight-color:transparent;}
  body{background:var(--bg);color:var(--texto);padding-bottom:250px;}
  header{background:var(--azul);color:#fff;padding:22px 18px 18px;}
  header h1{font-size:21px;}
  header p{font-size:13px;opacity:.88;margin-top:4px;line-height:1.45;}
  main{padding:14px;max-width:620px;margin:0 auto;}
  .etapas{display:flex;gap:6px;margin-bottom:14px;}
  .etapas span{flex:1;height:4px;border-radius:2px;background:#ddd5cc;}
  .etapas span.on{background:var(--azul);}
  h2{font-size:15px;color:var(--azul);margin:18px 2px 10px;}
  .card{background:#fff;border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.05);}
  .item{display:flex;gap:12px;align-items:center;}
  .item img{width:64px;height:64px;border-radius:10px;object-fit:cover;flex-shrink:0;background:#eee;}
  .item .info{flex:1;min-width:0;}
  .item .nome{font-weight:700;font-size:15px;}
  .item .desc{font-size:12.5px;color:#7a716a;margin-top:2px;line-height:1.35;}
  .item .preco{font-size:13px;font-weight:700;color:var(--azul);margin-top:4px;}
  .passo{display:flex;align-items:center;gap:6px;flex-shrink:0;}
  .passo button{width:36px;height:36px;border-radius:50%;border:1px solid var(--borda);background:#fff;font-size:20px;color:var(--azul);font-weight:700;}
  .passo button.mais{background:var(--azul);color:#fff;border-color:var(--azul);}
  .passo .q{min-width:44px;text-align:center;font-weight:700;font-size:14px;}
  .item.sel{outline:2px solid var(--azul);}
  label{display:block;font-size:12.5px;color:#5e5650;font-weight:600;margin:12px 0 5px;}
  select{width:100%;padding:12px;border-radius:10px;border:1px solid var(--borda);font-size:16px;background:#fff;color:var(--texto);}
  .opcao.grande{align-items:center;cursor:pointer;padding:14px;}
  .opcao .ilus{width:92px;flex-shrink:0;}
  .opcao .ilus svg{width:100%;height:auto;display:block;}
  h3.subgrupo{font-size:13px;color:#6a5f57;margin:14px 2px 8px;}
  .kit-inclui{font-size:12.5px;color:#5e5650;margin-top:4px;line-height:1.4;}
  .monte-tot{background:var(--azul-claro);border-radius:10px;padding:10px 12px;margin-top:12px;font-size:13.5px;line-height:1.5;}
  .monte-add{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #f1ece6;font-size:13.5px;}
  .monte-add button{border:none;background:none;color:var(--vermelho);font-size:13px;font-weight:700;}
  input,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid var(--borda);font-size:16px;background:#fff;color:var(--texto);}
  textarea{min-height:70px;resize:vertical;}
  .chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{border:1px solid var(--borda);background:#fff;border-radius:12px;padding:9px 12px;font-size:13.5px;font-weight:600;color:#4a433e;text-align:center;}
  .chip small{display:block;font-weight:500;font-size:11px;color:#8a817a;}
  .chip.on{background:var(--azul);color:#fff;border-color:var(--azul);}
  .chip.on small{color:#EADBCB;}
  .chip:disabled{opacity:.4;}
  .linha{display:flex;justify-content:space-between;gap:10px;padding:7px 0;font-size:14px;border-bottom:1px solid #f1ece6;}
  .linha:last-child{border-bottom:none;}
  .linha.total{font-weight:800;font-size:16px;}
  .linha.destaque{color:var(--azul);font-weight:800;}
  .muted{color:#8a817a;font-size:12.5px;line-height:1.45;}
  .barra{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--borda);padding:12px 14px calc(64px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center;z-index:5;}
  .foto-prev{display:flex;gap:10px;align-items:center;margin-top:8px;}
  .foto-prev img{width:72px;height:72px;object-fit:cover;border-radius:10px;}
  .barra .tot{flex:1;font-size:12px;color:#7a716a;}
  .barra .tot b{display:block;font-size:18px;color:var(--texto);}
  .btn{display:block;width:100%;border:none;border-radius:12px;padding:14px 18px;font-size:15.5px;font-weight:700;background:var(--azul);color:#fff;text-align:center;text-decoration:none;}
  .barra .btn{width:auto;flex-shrink:0;}
  .btn.sec{background:#efe9e3;color:#3d3631;}
  .btn.zap{background:#25D366;}
  .btn:disabled{opacity:.5;}
  .opcao{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--borda);border-radius:12px;padding:12px;margin-bottom:8px;background:#fff;}
  .opcao.on{border-color:var(--azul);background:var(--azul-claro);}
  .opcao input{width:auto;margin-top:3px;}
  .opcao b{font-size:14.5px;}
  .erro{background:var(--rosa-claro);color:var(--vermelho);border-radius:10px;padding:11px;font-size:13.5px;margin-top:10px;}
  .ok{background:#e8f5e9;color:var(--verde);border-radius:10px;padding:11px;font-size:13.5px;margin-top:10px;}
  .qr{display:flex;justify-content:center;margin:12px 0;}
  .qr svg{width:220px;height:220px;}
  .copia{font-family:monospace;font-size:11px;word-break:break-all;background:#f6f2ee;padding:10px;border-radius:8px;max-height:72px;overflow:auto;}
  .status{display:flex;gap:4px;margin:6px 0 2px;}
  .status div{flex:1;text-align:center;font-size:10.5px;color:#9a918a;}
  .status div i{display:block;height:5px;border-radius:3px;background:#e6dfd8;margin-bottom:5px;}
  .status div.on{color:var(--azul);font-weight:700;}
  .status div.on i{background:var(--azul);}
  .oculto{display:none !important;}
  .carregando{text-align:center;color:#7a716a;padding:60px 20px;}
</style>
</head>
<body>
<header>
  <h1 id="hLoja">🎂 Encomendas</h1>
  <p id="hSub">Escolha, marque a data e garanta seu pedido com o sinal.</p>
  <p id="hBomb" style="display:none;margin-top:8px"><a id="hBombA" style="color:#fff;font-weight:700;text-decoration:underline" href="#">🍬 Ver a bomboniere: balas, chocolates e salgadinhos</a></p>
</header>

<main>
  <div class="carregando" id="carregando">Carregando o cardápio...</div>
  <div id="erroGeral" class="erro oculto"></div>
  <div id="progresso" class="oculto"></div>

  <!-- ETAPA 1: escolher -->
  <section id="e1" class="oculto">
    <div id="dicaDesconto" class="oculto"></div>
    <div id="catalogo"></div>
  </section>

  <!-- ETAPA 2: data, entrega, dados -->
  <section id="e2" class="oculto">
    <h2>📅 Data</h2>
    <div class="chips" id="datas"></div>
    <div class="muted" id="datasInfo" style="margin-top:8px;"></div>
    <h2>🕐 Horário</h2>
    <div class="chips" id="horarios"></div>
    <h2 id="tituloModo">📍 Retirada</h2>
    <div id="modos"></div>
    <div id="boxEndereco" class="oculto">
      <label>Endereço de entrega (rua, número, bairro, cidade)</label>
      <textarea id="endereco" placeholder="Rua, número, complemento, bairro, cidade"></textarea>
    </div>
    <h2>🙋 Seus dados</h2>
    <label>Nome</label><input id="nome" autocomplete="name">
    <label>WhatsApp com DDD</label><input id="whats" type="tel" inputmode="tel" autocomplete="tel" placeholder="11 99999-8888">
    <label>Observações (tema, cores, escrita no bolo...)</label>
    <textarea id="obs" placeholder="Ex: tema Frozen, escrever 'Parabéns Ana'"></textarea>
    <label>Foto de referência (opcional)</label>
    <input type="file" id="foto" accept="image/*" onchange="lerFoto(this)">
    <div class="foto-prev oculto" id="fotoPrev"><img id="fotoImg" alt=""><span class="muted">Foto anexada. <a href="#" onclick="tirarFoto();return false;">Remover</a></span></div>
    <div id="erro2" class="erro oculto"></div>
  </section>

  <!-- ETAPA 3: resumo e pagamento -->
  <section id="e3" class="oculto">
    <h2>🧾 Resumo</h2>
    <div class="card" id="resumo"></div>
    <h2>💳 Como quer pagar o sinal?</h2>
    <div id="formas"></div>
    <div class="card" style="margin-top:8px;">
      <div class="muted" id="politica"></div>
      <label style="display:flex;gap:8px;align-items:flex-start;font-weight:500;margin-top:10px;"><input type="checkbox" id="aceite" style="width:auto;margin-top:2px;" onchange="limparErro('erro3')"> Li e aceito a política de cancelamento.</label>
    </div>
    <div id="erro3" class="erro oculto"></div>
  </section>

  <!-- PEDIDO (depois de criado / link de acompanhamento) -->
  <section id="ePedido" class="oculto"></section>
</main>

<div class="promo oculto" id="promo"></div>
<div class="barra oculto" id="barra">
  <button class="btn sec" id="btnVoltar" onclick="voltar()">←</button>
  <div class="tot"><span id="barraRotulo">Total</span><b id="barraTotal">R$ 0,00</b></div>
  <button class="btn" id="btnAvancar" onclick="avancar()">Continuar</button>
</div>

<script>
//---------------------------------------------------------------------
//
// QR Code Generator for JavaScript
//
// Copyright (c) 2009 Kazuhiko Arase
//
// URL: http://www.d-project.com/

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

<script>
// ============================================================
// Página de encomendas: fala com a planilha da loja (Apps Script).
// Endereço: encomenda.html?s=ID_DO_SCRIPT  (pedido: &t=TOKEN)
// ============================================================
var Q = new URLSearchParams(location.search);
var SCRIPT = Q.get('s') ? 'https://script.google.com/macros/s/' + Q.get('s').replace(/[^\w-]/g, '') + '/exec' : '';
var TOKEN = (Q.get('t') || '').replace(/[^a-f0-9]/gi, '');
var C = null;               // catálogo
var carrinho = {};          // id -> qtd
var saborKit = {};          // id do kit -> id do bolo escolhido
var montados = [];          // bolos montados: { massa, recheios: [], kg }
var MONT = { massa: '', recheios: [], frutas: [], kg: 0 };
var esc_ = { data: '', horario: '', modo: 'retirada', forma: '' };
var etapa = 1;
var FOTO = null;   // { tipo, base64 } já reduzida no celular antes de enviar
function lerFoto(inp) {
  var f = inp.files && inp.files[0];
  if (!f) return;
  if (!/^image\//.test(f.type)) { alert('Escolha uma imagem.'); inp.value = ''; return; }
  var img = new Image(), url = URL.createObjectURL(f);
  img.onload = function () {
    var max = 1600, w = img.width, h = img.height, k = Math.min(1, max / Math.max(w, h));
    var cv = document.createElement('canvas'); cv.width = Math.round(w * k); cv.height = Math.round(h * k);
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    var dataUrl = cv.toDataURL('image/jpeg', 0.82);
    URL.revokeObjectURL(url);
    FOTO = { tipo: 'image/jpeg', base64: dataUrl.split(',')[1] };
    $('fotoImg').src = dataUrl; $('fotoPrev').classList.remove('oculto');

  img.onerror = function () { alert('Não consegui abrir essa imagem. Tente outra (JPG ou PNG).'); inp.value = ''; };
  img.src = url;
}
function tirarFoto() { FOTO = null; $('foto').value = ''; $('fotoPrev').classList.add('oculto'); }

function $(id) { return document.getElementById(id); }
function brl(v) { return (Number(v) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

function dataLonga(iso) { var d = new Date(iso + 'T12:00:00'); return d.toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: '2-digit' }); }
function mostrarErro(id, m) { var e = $(id); e.textContent = m; e.classList.remove('oculto'); e.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
function limparErro(id) { $(id).classList.add('oculto'); }

function api(fn, args) {
  if (!SCRIPT) return Promise.reject(new Error('Link incompleto. Peça o link de encomendas para a loja.'));
  return fetch(SCRIPT, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ loja: fn, args: args || [] }) })
    .then(function (r) { return r.text(); })

}

// ── ETAPA 1: cardápio ──
function iniciar() {
  api('lojaCatalogo').then(function (c) {
    C = c;
    $('hLoja').textContent = '🎂 ' + c.loja;
    if (c.bomboniere) { $('hBombA').href = 'bomboniere.html?s=' + encodeURIComponent(Q.get('s') || ''); $('hBomb').style.display = 'block'; }
    document.title = 'Encomendas · ' + c.loja;
    $('hSub').textContent = 'Escolha, marque a data e garanta seu pedido com ' + c.sinalPct + '% de sinal.';
    $('carregando').classList.add('oculto');
    if (!c.itens.length) { mostrarErro('erroGeral', 'O cardápio está sendo atualizado. Fale com a loja.'); return; }
    montarFluxo();
    irPasso(0);
  }).catch(function (e) { $('carregando').classList.add('oculto'); mostrarErro('erroGeral', e.message); });
}

// ── PASSOS: tipo de bolo → bolos → docinhos → topo → data e dados → pagamento ──
var TIPO = '';                                  // 'comum' | 'andar' | 'doces'
var ANDAR = { kg: 0, baixo: '', cima: '' };     // bolo de andar
var PESSOAS = 0;
var MODO_BOLO = 'cardapio';                     // 'cardapio' (sabores prontos) | 'montar' (monte seu bolo)
var FLUXO = [], passo = 0;
var NOMES_PASSO = { tipo: 'Tipo de bolo', bolos: 'Bolo', doces: 'Docinhos', topo: 'Topo de bolo', dados: 'Data e seus dados', pagar: 'Resumo e pagamento' };
function porTipo(t) { return C.itens.filter(function (x) { return x.tipo === t; }); }
function kitsComBolo() { return C.itens.filter(function (x) { return x.tipo === 'Kit' && x.kitKg > 0; }).sort(function (a, b) { return a.kitKg - b.kitKg || a.preco - b.preco; }); }
function kitsSemBolo() { return C.itens.filter(function (x) { return x.tipo === 'Kit' && !(x.kitKg > 0); }); }
function montarFluxo() {
  var f = ['tipo'];
  if (TIPO !== 'doces') f.push('bolos');
  if (porTipo('Produto').length || kitsSemBolo().length) f.push('doces');
  if (TIPO !== 'doces' && porTipo('Adicional').length) f.push('topo');
  FLUXO = f.concat(['dados', 'pagar']);
}
function chave() { return FLUXO[passo]; }
function renderProgresso() {
  $('progresso').innerHTML = '<div class="etapas">' + FLUXO.map(function (k, i) { return '<span' + (i <= passo ? ' class="on"' : '') + '></span>'; }).join('') + '</div>' +
    '<div class="muted" style="margin:-6px 2px 4px;">Passo ' + (passo + 1) + ' de ' + FLUXO.length + ' · ' + NOMES_PASSO[chave()] + '</div>';
}
function irPasso(i) {
  passo = i;
  var k = chave(), cat = ['tipo', 'bolos', 'doces', 'topo'].indexOf(k) >= 0;
  etapa = k === 'pagar' ? 3 : k === 'dados' ? 2 : 1;
  $('e1').classList.toggle('oculto', !cat);
  $('e2').classList.toggle('oculto', k !== 'dados');
  $('e3').classList.toggle('oculto', k !== 'pagar');
  $('barra').classList.remove('oculto');
  $('progresso').classList.remove('oculto');
  renderProgresso();
  if (cat) renderPagina();
  if (k === 'dados') renderEtapa2();
  if (k === 'pagar') renderEtapa3();

}
function renderPagina() {
  var k = chave(), h = '';

  else if (k === 'bolos') h = TIPO === 'andar' ? pgAndar() : pgBolos();
  else if (k === 'doces') h = pgDoces();
  else if (k === 'topo') h = pgTopo();
  $('catalogo').innerHTML = h;
  if (k === 'bolos' && TIPO !== 'andar' && C.montagem) { MONT.kg = MONT.kg || C.montagem.min; renderMonte(); }
  if (k === 'bolos' && TIPO === 'andar') renderAndar();
}

// ── ilustrações (mesma escala: dá para comparar os tamanhos) ──
function corpoBolo(x, y, w, h, camadas) {
  var rec = 5, cam = (h - rec * (camadas - 1)) / camadas, yy = y, cx = x + w / 2;
  var out = '<ellipse cx="' + cx + '" cy="' + (y + h) + '" rx="' + (w / 2) + '" ry="7" fill="#EFD3A8"/>';
  for (var i = 0; i < camadas; i++) {
    out += '<rect x="' + x + '" y="' + yy.toFixed(1) + '" width="' + w + '" height="' + cam.toFixed(1) + '" fill="#EFD3A8"/>';
    yy += cam;
    if (i < camadas - 1) { out += '<rect x="' + x + '" y="' + yy.toFixed(1) + '" width="' + w + '" height="' + rec + '" fill="#8A5636"/>'; yy += rec; }

function svgBolo(w, h, camadas) {
  return '<svg viewBox="0 0 160 150" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><ellipse cx="80" cy="133" rx="' + (w / 2 + 14) + '" ry="9" fill="#E3D8CD"/>' +
    corpoBolo(80 - w / 2, 128 - h, w, h, camadas) + '</svg>';
}
function svgAndar() {
  return '<svg viewBox="0 0 160 150" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><ellipse cx="80" cy="133" rx="70" ry="9" fill="#E3D8CD"/>' +
    corpoBolo(25, 84, 110, 44, 2) + corpoBolo(46, 40, 68, 38, 2) + '</svg>';

// ── PASSO: tipo de bolo ──
function opcaoGrande(on, fn, svg, titulo, sub) {
  return '<div class="opcao grande' + (on ? ' on' : '') + '" onclick="' + fn + '"><div class="ilus">' + svg + '</div><div><b>' + titulo + '</b><div class="muted">' + sub + '</div></div></div>';
}
function pgTipo() {
  return '<h2>🎂 Que tipo de bolo você quer?</h2>' +
    opcaoGrande(TIPO === 'comum', "escolherTipo('comum')", svgBolo(110, 46, 2), 'Bolo comum',
      'Um andar, com os sabores do cardápio' + (kitsComBolo().length ? ', kits festa' : '') + (C.montagem ? ' ou monte o seu' : '') + '.') +
    opcaoGrande(TIPO === 'andar', "escolherTipo('andar')", svgAndar(), 'Bolo de andar',
      'Dois andares, até 2 sabores (um em cada andar). A partir de ' + num(C.andar.min) + ' kg.') +
    (porTipo('Produto').length ? '<button class="btn sec" style="margin-top:6px;" onclick="escolherTipo(\'doces\')">' + (TIPO === 'doces' ? '✓ ' : '') + 'Só quero docinhos, sem bolo</button>' : '');
}
function escolherTipo(t) {
  if (t !== TIPO) {
    var tira = function (f) {
      Object.keys(carrinho).forEach(function (id) {
        var it = C.itens.filter(function (x) { return x.id === id; })[0];
        if (it && f(it)) { delete carrinho[id]; delete saborKit[id]; }
      });
    };
    if (t !== 'comum') { tira(function (it) { return it.bolo || (it.tipo === 'Kit' && it.kitKg > 0); }); montados = []; MONT = { massa: '', recheios: [], frutas: [], kg: 0 }; MODO_BOLO = 'cardapio'; }
    if (t !== 'andar') ANDAR = { kg: 0, baixo: '', cima: '' };
    if (t === 'doces') tira(function (it) { return it.tipo === 'Adicional'; });

  }
  montarFluxo();
  irPasso(1);
}

// ── PASSO: bolos (comum) ──
function pgBolos() {
  var og = ordenarGrupos(C.itens.filter(function (x) { return x.bolo; }), C.ordemCategorias), h = cardPessoas();
  if (C.montagem) {
    h += '<div class="modos-bolo">' +
      '<button class="modo-bolo' + (MODO_BOLO === 'cardapio' ? ' on' : '') + '" onclick="modoBolo(\'cardapio\')">📋 Sabores do cardápio<small>bolos já montados pela confeitaria</small></button>' +
      '<button class="modo-bolo' + (MODO_BOLO === 'montar' ? ' on' : '') + '" onclick="modoBolo(\'montar\')">🎨 Montar meu bolo<small>você escolhe massa e recheios</small></button></div>';
    if (MODO_BOLO === 'montar') return h + htmlMonte() + resumoOutroModo();
  }
  h += og.ordem.map(function (g) { return '<h2>🎂 ' + esc(og.ordem.length > 1 ? g : 'Sabores (preço por kg)') + '</h2>' + og.grupos[g].map(htmlItem).join(''); }).join('');
  if (C.montagem) h += resumoOutroModo();
  if (kitsComBolo().length) h += '<h2>🎁 Kits festa</h2><div class="muted" style="margin:-4px 2px 10px;">Bolo e docinhos com preço fechado. Você escolhe o sabor do bolo.</div>' + kitsComBolo().map(htmlItem).join('');
  return h;
}
function modoBolo(m) { MODO_BOLO = m; renderPagina(); atualizarBarra(); }
// o que já está no pedido pelo outro caminho (para não parecer que sumiu)
function resumoOutroModo() {
  var L = itensEscolhidos();
  if (MODO_BOLO === 'montar') {
    var prontos = L.filter(function (x) { return x.kg > 0 && !x.montado; });
    if (!prontos.length) return '';
    return '<div class="muted" style="margin:10px 2px;">Também no pedido: ' + prontos.map(function (x) { return esc(x.rotulo) + ' ' + num(x.kg) + ' kg'; }).join(', ') + '. <a href="#" style="color:var(--azul);font-weight:700;" onclick="modoBolo(\'cardapio\');return false;">Ver sabores</a></div>';
  }
  if (!montados.length) return '';
  return '<div class="card" style="margin-top:12px;"><b>🎨 Bolo' + (montados.length > 1 ? 's' : '') + ' que você montou</b>' + montados.map(function (m) {
    return '<div class="muted" style="margin-top:4px;">✅ ' + num(m.kg) + ' kg · ' + esc(descMontado(m)) + '</div>'; }).join('') +
    '<a href="#" style="display:inline-block;margin-top:6px;color:var(--azul);font-weight:700;font-size:13px;" onclick="modoBolo(\'montar\');return false;">Editar</a></div>';
}
function cardPessoas() {
  return '<div class="card" style="margin-top:12px;"><b>🎉 Para quantas pessoas é a festa?</b><div style="display:flex;gap:8px;align-items:center;margin-top:8px;"><input id="pessoas" type="number" inputmode="numeric" min="1" placeholder="nº de pessoas" oninput="calcPessoas()" style="max-width:150px;" value="' + (PESSOAS || '') + '"></div>' +
    '<div class="muted" id="pessoasRes" style="margin-top:6px;">' + textoPessoas() + '</div><div class="muted" style="margin-top:4px;">Cada 1 kg de bolo ' + fatiasTexto(null, 1) + ', em média.</div></div>';
}
function calcPessoas() { PESSOAS = parseInt($('pessoas').value, 10) || 0; $('pessoasRes').innerHTML = textoPessoas(); }
function kgParaPessoas(n) { var min = TIPO === 'andar' ? C.andar.min : 1; return Math.max(min, Math.ceil(n / fx(null).min * 2) / 2); }

  var n = PESSOAS;
  if (!(n > 0)) return '';

  if (TIPO === 'andar') h += ' <a href="#" style="color:var(--azul);font-weight:700;" onclick="usarKgAndar(' + kg + ');return false;">Usar ' + num(kg) + ' kg</a>';
  else {
    var kit = kitsComBolo().filter(function (k) { return k.kitKg * fx(null).min >= n; })[0];
    if (kit) h += ' Ou o <b>' + esc(kit.nome) + '</b>, que já vem com docinhos.';
  }

}

// ── PASSO: bolo de andar ──
function pgAndar() { return '<h2>🎂 Bolo de andar</h2><div class="card" id="andar"></div>' + cardPessoas(); }
function precoAndar() {
  var b = boloPorId(ANDAR.baixo), c = boloPorId(ANDAR.cima);
  return b && c ? Math.round((Math.max(b.preco, c.preco) + (C.andar.acrescimo || 0)) * 100) / 100 : 0;
}

}

    }).join('') + '</div>';
  };
  $('andar').innerHTML = '<div style="display:flex;gap:12px;align-items:center;"><div style="width:96px;flex-shrink:0;">' + svgAndar() + '</div>' +
    '<div class="muted">Dois andares, com até 2 sabores: um para o andar de baixo e outro para o de cima (podem ser iguais). Peso mínimo de <b>' + num(A.min) + ' kg</b>. O bolo de andar não entra nas promoções de desconto.</div></div>' +
    '<label>Peso total</label><div class="passo"><button onclick="kgAndar(-1)">−</button><span class="q">' + num(ANDAR.kg) + ' kg</span><button class="mais" onclick="kgAndar(1)">+</button>' +
    '<span class="muted" style="margin-left:6px;">' + fatiasTexto(null, ANDAR.kg) + '</span></div>' +
    '<label>Sabor do andar de baixo (o maior)</label>' + chips('baixo') +

    (pr ? '<div class="monte-tot">' + esc(descAndar()) + '<br><b>' + brl(pr) + '/kg · ' + num(ANDAR.kg) + ' kg = ' + brl(pr * ANDAR.kg) + '</b>' +

// ── PASSOS: docinhos e topo (dá para pular) ──
function listaAgrupada(itens) {
  var og = ordenarGrupos(itens, C.ordemCategorias);
  return og.ordem.map(function (g) { return (og.ordem.length > 1 ? '<h3 class="subgrupo">' + esc(g) + '</h3>' : '') + og.grupos[g].map(htmlItem).join(''); }).join('');
}
function pgDoces() {
  var itens = porTipo('Produto').concat(kitsSemBolo()), og = ordenarGrupos(itens, C.ordemCategorias);
  var titulo = og.ordem.length === 1 ? og.ordem[0] : 'Docinhos';
  return '<h2>🍬 ' + esc(titulo) + '</h2>' +
    (TIPO === 'doces' ? '' : '<div class="muted" style="margin:-4px 2px 10px;">Quer docinhos para acompanhar o bolo? Se não quiser, é só tocar em <b>Pular</b>.</div>') +

    '<div class="linha"><span>Sinal (' + (p.situacao && ['Sinal pago', 'Pix do saldo informado', 'Pago'].indexOf(p.situacao) >= 0 ? 'pago' : 'a pagar') + ')</span><span>' + brl(p.sinal) + '</span></div>' +
    '<div class="muted" style="margin-top:8px;">📅 ' + (p.data ? esc(dataLonga(p.data)) : '') + (p.horario ? ' às ' + esc(p.horario) : '') + '<br>📍 ' +
    (p.modo === 'Entrega' ? 'Entrega: ' + esc(p.endereco) : 'Retirada: ' + esc(p.enderecoRetirada)) + (p.obs ? '<br>📝 ' + esc(p.obs) : '') + '</div></div>';
  if (p.avaliacao) h += '<div class="card" style="text-align:center;"><b>Gostou? 💛</b><div class="muted" style="margin:4px 0 10px;">Sua avaliação ajuda muito a loja.</div><a class="btn" target="_blank" href="' + esc(p.avaliacao) + '">⭐ Avaliar no Google</a></div>';
  if (p.whatsLoja) h += '<a class="btn zap" target="_blank" href="https://api.whatsapp.com/send?phone=55' + p.whatsLoja + '&text=' + encodeURIComponent('Oi! Sobre minha encomenda ' + p.id + ' (' + p.nome + ').') + '">📲 Falar com a loja' + (p.foto ? '' : ' (enviar foto de referência)') + '</a>';
  h += '<button class="btn sec" style="margin-top:8px;" onclick="abrirPedido()">↻ Atualizar status</button>';
  h += '<div class="muted" style="margin-top:12px;">Guarde este link para acompanhar seu pedido.</div>';
  $('ePedido').innerHTML = h;
  $('ePedido').classList.remove('oculto');
  window.scrollTo(0, 0);
}

function svgQr(t) { var q = qrcode(0, 'M'); q.addData(t); q.make(); return q.createSvgTag(5, 2); }
function copiarPix() {
  var t = $('pixCod').textContent;
  var ok = function () { alert('Código Pix copiado. Cole no app do seu banco em Pix → Copia e cola.'); };
  if (navigator.clipboard) navigator.clipboard.writeText(t).then(ok, function () { prompt('Copie o código:', t); }); else prompt('Copie o código:', t);
}
var COMP = null;
function lerComprovante(inp) {
  var f = inp.files && inp.files[0];
  if (!f) return;
  if (!/^image\//.test(f.type)) { alert('Envie uma imagem (print ou foto do comprovante).'); inp.value = ''; return; }
  var img = new Image(), url = URL.createObjectURL(f);
  img.onload = function () {
    var k = Math.min(1, 1600 / Math.max(img.width, img.height)), cv = document.createElement('canvas');
    cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    var du = cv.toDataURL('image/jpeg', 0.85); URL.revokeObjectURL(url);
    COMP = { tipo: 'image/jpeg', base64: du.split(',')[1] };
    $('compImg').src = du; $('compPrev').classList.remove('oculto');
  };
  img.onerror = function () { alert('Não consegui abrir essa imagem.'); inp.value = ''; };
  img.src = url;
}
function informarPix(b) {
  b.disabled = true; b.textContent = 'Enviando...';
  api('lojaInformarPix', [TOKEN, COMP]).then(renderPedido).catch(function (e) { b.disabled = false; b.textContent = 'Já fiz o Pix'; mostrarErro('erroPg', e.message); });
}
function pagarCartao(logoAposCriar, b) {
  if (b) { b.disabled = true; b.textContent = 'Abrindo o Mercado Pago...'; }
  return api('lojaPagarCartao', [TOKEN]).then(function (r) { location.href = r.url; })
    .catch(function (e) { if (logoAposCriar) { abrirPedido(); setTimeout(function () { alert(e.message + '\nVocê pode pagar com Pix nesta tela.'); }, 600); } else { if (b) { b.disabled = false; b.textContent = 'Pagar com cartão de crédito'; } mostrarErro('erroPg', e.message); } });
}

if (TOKEN) abrirPedido(); else iniciar();
</script>
</body>
</html>
